name: "Tests"

# Ruff, and the test suite (including the doctests in the package, the
# dashboard and README.md) on every supported Python with the locked
# dependencies. Also run by publish.yml before a release.

on:
  workflow_dispatch:
  workflow_call:  # by the release, in publish.yml
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Ruff
        run: |
          uv run ruff check
          uv run ruff format --check

  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run the tests
        run: uv run --group test pytest -q -rs
