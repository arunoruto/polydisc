name: "Build and publish"

# Releasing: run this workflow by hand on main ("Run workflow", or
# `gh workflow run publish.yml --ref main`). After the test suite has
# passed, python-semantic-release derives the next version from the
# commit messages since the last release (configured in pyproject.toml),
# updates pyproject.toml, __version__, uv.lock and CHANGELOG.md, commits,
# tags and creates the GitHub release. The sdist and wheel are then built
# from that tag, checked, uploaded to PyPI through trusted publishing (no
# token) from the `pypi` environment, and attached to the GitHub release.
# Without commits that call for a release, nothing is released.
#
# PyPI's trusted publisher for polydisc is configured for this file name
# (publish.yml) and the `pypi` environment; the job that uploads to PyPI
# must stay in here.
#
# The tag exists before the distributions are built: if the build fails,
# delete the release and tag (`gh release delete <tag> --cleanup-tag`)
# and revert the release commit, or fix forward.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  release:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released || 'false' }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Release from the commit the workflow started on
        run: git reset --hard ${{ github.sha }}

      # Also refuses to release if main has moved on since the run started.
      - name: Version, changelog, tag and GitHub release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

  build:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Check that the release tag matches the version
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match version $version" >&2
            exit 1
          fi

      - name: Build the sdist and wheel
        run: uv build

      - name: Sample a periodic box with the wheel
        run: >
          uv run --isolated --no-project --with dist/*.whl python -c
          "import polydisc as p;
          k = p.sample(p.Box([12.0, 12.0, 8.0], periodic=(True, True, False)), 1.0, gap=0.5, seed=0);
          assert k.n > 0 and p.gap_report(k.points, k.radii, k.region)['min'] >= 0.5 - 1e-9;
          print(p.__version__, k.n)"

      - name: Keep the distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: [release, build]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/polydisc/
    permissions:
      contents: write  # release assets
      id-token: write  # trusted publishing
    steps:
      - name: Fetch the distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2

      # Not python-semantic-release/publish-action: on a checkout of the
      # tag (a detached HEAD) it matches no release branch and gives up.
      - name: Attach them to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload ${{ needs.release.outputs.tag }} dist/*
          --repo ${{ github.repository }} --clobber
