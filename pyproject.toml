[project]
name = "polydisc"
version = "0.3.0"
description = "Polydisperse Poisson-disc sampling for discs and spheres"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Mirza Arnaut" }]
keywords = ["poisson-disc", "bridson", "packing", "polydisperse", "numba"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.3.0,<2.4",
    "numba>=0.62",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/arunoruto/polydisc"

[project.optional-dependencies]
# Everything the dashboard needs on top of the library itself. Kept out
# of the core dependencies so `pip install polydisc` stays small for the
# many users who only want the sampler.
dashboard = [
    "streamlit>=1.40",
    "plotly>=5.24",
    "matplotlib>=3.9",
]

[dependency-groups]
test = ["pytest>=8"]
dev = ["ruff>=0.16", "polydisc[dashboard]"]

[project.scripts]
polydisc = "polydisc.cli:cli"

[tool.pyright]
exclude = [".venv"]
venvPath = ".venv"
venv = "."

[tool.ty.environment]
python = "./.venv"

[tool.ruff]
lint.ignore = ["F722"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/polydisc", "dashboard", "README.md"]
# Neither folder is a package, so put both on the path: the dashboard
# imports its own siblings, and the tests import packing_asserts.
pythonpath = ["dashboard", "tests"]
python_files = "test_*.py"
# importlib import mode keeps same-named modules in different folders
# apart -- with --doctest-modules there are two conftest.py files to
# collect, and the legacy prepend mode cannot tell them apart.
addopts = "--doctest-modules --doctest-glob=*.md --import-mode=importlib"
doctest_optionflags = "NORMALIZE_WHITESPACE ELLIPSIS"
norecursedirs = ["docs", "docs/_build", ".devenv", ".venv", "reference"]
markers = ["slow: benchmarks and saturation runs that take seconds"]
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.uv.build-backend]
module-name = "polydisc"
module-root = "src"

[build-system]
requires = ["uv_build >= 0.8.0, <0.13.0"]
build-backend = "uv_build"
