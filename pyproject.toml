[project]
name = "polydisc"
version = "0.4.0"
description = "Polydisperse Poisson-disc sampling for discs and spheres"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mirza Arnaut", email = "mirza.arnaut@tu-dortmund.de" }]
keywords = [
    "poisson-disc",
    "bridson",
    "packing",
    "polydisperse",
    "spheres",
    "periodic",
    "numba",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    # No upper bound on NumPy: each Numba release caps the NumPy it
    # supports itself. 0.63 is the first Numba with Python 3.14 wheels.
    "numpy>=2.3.0",
    "numba>=0.63",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/arunoruto/polydisc"
Issues = "https://github.com/arunoruto/polydisc/issues"
Changelog = "https://github.com/arunoruto/polydisc/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Everything the dashboard needs on top of the library itself. Kept out
# of the core dependencies so `pip install polydisc` stays small for the
# many users who only want the sampler.
dashboard = [
    "streamlit>=1.40",
    "plotly>=5.24",
    "matplotlib>=3.9",
]

[dependency-groups]
test = ["pytest>=8"]
dev = ["ruff>=0.16", "polydisc[dashboard]"]

[project.scripts]
polydisc = "polydisc.cli:cli"

[tool.semantic_release]
# Releases are made by the "Build and publish" workflow (publish.yml).
version_toml = ["pyproject.toml:project.version"]
# The dashboard runs from the source tree without installing the
# package, so __version__ is a literal rather than read from metadata.
version_variables = ["src/polydisc/__init__.py:__version__"]
# Stay on 0.x: breaking changes raise the minor version until 1.0.0 is
# chosen.
allow_zero_version = true
major_on_zero = false
commit_message = "chore(release): v{version}\n\nAutomatically generated by python-semantic-release"
# Keeps the project's entry in uv.lock at the new version. The release
# action runs in a container of its own, which has no uv.
build_command = """
python -m pip install --quiet "uv>=0.8,<1"
uv lock --upgrade-package polydisc
git add uv.lock
"""

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "feat", "fix", "perf", "refactor", "docs", "test", "build", "ci", "chore",
    "style", "revert",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
# Inserts each release's entry below the `<!-- version list -->` marker
# and leaves the rest of CHANGELOG.md as written (see its header).
mode = "update"
exclude_commit_patterns = ['Merge pull request #\d+', 'chore\(release\):']

[tool.pyright]
exclude = [".venv"]
venvPath = ".venv"
venv = "."

[tool.ty.environment]
python = "./.venv"

[tool.ruff]
lint.ignore = ["F722"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/polydisc", "dashboard", "README.md"]
# Neither folder is a package, so put both on the path: the dashboard
# imports its own siblings, and the tests import packing_asserts.
pythonpath = ["dashboard", "tests"]
python_files = "test_*.py"
# importlib import mode keeps same-named modules in different folders
# apart -- with --doctest-modules there are two conftest.py files to
# collect, and the legacy prepend mode cannot tell them apart.
addopts = "--doctest-modules --doctest-glob=*.md --import-mode=importlib"
doctest_optionflags = "NORMALIZE_WHITESPACE ELLIPSIS"
norecursedirs = ["docs", "docs/_build", ".devenv", ".venv", "reference"]
markers = ["slow: benchmarks and saturation runs that take seconds"]
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.uv.build-backend]
module-name = "polydisc"
module-root = "src"

[build-system]
requires = ["uv_build >= 0.8.0, <0.13.0"]
build-backend = "uv_build"
